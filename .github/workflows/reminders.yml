name: Daily reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification now'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node scripts/send-reminders.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GROUP_CODES: ${{ secrets.GROUP_CODES }}
          TEST: ${{ inputs.test }}
      # GitHub pauses scheduled jobs in repositories with no commits for 60 days.
      # Once a month this records the date so the reminders keep running.
      - name: Keep the schedule active
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3456000 ]; then
            date -u +%F > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "Keep daily reminders running" && git push
          fi
